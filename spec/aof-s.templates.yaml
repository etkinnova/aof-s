apiVersion: aof-s/v1
kind: Templates
metadata:
  name: AOF-S Spec-Driven Generation Templates
  version: "1.6"
  compatible_versions: []
  description: >
    Spec-Driven generation templates for ASA agents. Loaded only by N3 when
    creating or upgrading agents. Templates use Handlebars-like placeholders
    enclosed in {{ double braces }}. Values from the generation plan override
    context_defaults. context_defaults are inherited from parent levels via
    'extends'.

spec:
  runtime_placeholders:
    description: "Placeholders generated by the runtime, not from the plan or context_defaults."
    placeholders:
      - name: creation_date
        source: "runtime (chrono::Utc::now())"
        type: string
        example: "2026-08-23"
      - name: instance_id
        source: "runtime (timestamp)"
        type: string
        example: "agent-1789999999"
      - name: skill_body
        source: "skill body (Markdown)"
        type: string
        example: "# Instructions\n..."
      - name: inference_info
        source: "context_defaults (configurable)"
        type: string
        example: "Local inference via Ollama"

  level_1:
    context_defaults:
      inference_endpoint: "http://localhost:11434/api/generate"
      inference_model: "llama3.2:latest"
      notes: ""
      constraints: []
      profile: "standalone"
      team_participation: false
      inference_info: "Local inference via Ollama"
      max_previous_lines: 3
      max_rules_in_prompt: 3
      use_json_response: false
      context_summary: ""
      hypothesis_prompt_template: ""
      run_mode: "once"
      interval_seconds: null
      vcv: []
      heartbeat_interval_secs: 30
      heartbeat_timeout_secs: 60
      trust_score_config: null
      plan: null
      evaluation:
        llm_mission_check: false
        llm_mission_prompt: ""

    artifacts:
      00_manifest.yaml: |
        framework: AOF-S v1.6
        level: 1
        name: "{{ agent_name }}"
        project: "{{ project_name }}"
        created: "{{ creation_date }}"
        agent_instance: "{{ instance_id }}"
        profile: "{{ profile }}"
        active_skills:
          {{ #each active_skills }}
          - "{{ this }}"
          {{ /each }}
        imports:
          {{ #each imports }}
          - path: "{{ this.path }}"
            include:
              {{ #each this.include }}
              - "{{ this }}"
              {{ /each }}
            conflict_policy: "{{ this.conflict_policy }}"
          {{ /each }}

      01_agent_spec/agent_spec.yaml: |
        role: "{{ role }}"
        vcv:
          {{ #each vcv }}
          - "{{ this }}"
          {{ /each }}
        allowed_tools:
          {{ #each allowed_tools }}
          - "{{ this }}"
          {{ /each }}
        offered_capabilities:
          {{ #each offered_capabilities }}
          - "{{ this }}"
          {{ /each }}
        team_participation: {{ team_participation }}
        constraints:
          max_parallel_actions: {{ max_parallel_actions }}
          timeout_per_request_ms: {{ timeout_per_request_ms }}
          max_previous_lines: {{ max_previous_lines }}
        run_mode: "{{ run_mode }}"
        interval_seconds: {{ interval_seconds }}
        inference:
          mode: "local_first"
          endpoint: "{{ inference_endpoint }}"
          model: "{{ inference_model }}"
          use_json_response: {{ use_json_response }}
        context_summary: "{{ context_summary }}"
        heartbeat_interval_secs: {{ heartbeat_interval_secs }}
        heartbeat_timeout_secs: {{ heartbeat_timeout_secs }}
        {{ #if trust_score_config }}
        trust_score_config:
          hypothesis_weight: {{ trust_score_config.hypothesis_weight }}
          reliability_weight: {{ trust_score_config.reliability_weight }}
          sla_weight: {{ trust_score_config.sla_weight }}
          peer_weight: {{ trust_score_config.peer_weight }}
          history_size: {{ trust_score_config.history_size }}
          min_samples: {{ trust_score_config.min_samples }}
        {{ /if }}
        {{ #if plan }}
        plan:
          steps:
            {{ #each plan.steps }}
            - id: "{{ this.id }}"
              tool: "{{ this.tool }}"
              params: {{ this.params }}
              on_error: "{{ this.on_error }}"
              {{ #if this.success_criteria }}
              success_criteria:
                type: "{{ this.success_criteria.type }}"
                {{ #if this.success_criteria.tool }}
                tool: "{{ this.success_criteria.tool }}"
                {{ /if }}
                {{ #if this.success_criteria.path }}
                path: "{{ this.success_criteria.path }}"
                {{ /if }}
              {{ /if }}
            {{ /each }}
        {{ /if }}
        evaluation:
          llm_mission_check: {{ evaluation.llm_mission_check }}
          llm_mission_prompt: "{{ evaluation.llm_mission_prompt }}"
        evaluation:
          metrics:
            - task_success_rate

      02_context_static.md: |
        # Static context for {{ agent_name }}

        ## Stack
        - Language: Rust
        - Runtime: Tokio
        - {{ inference_info }}

        ## Mission
        {{ mission_description }}

        ## Creation
        Automatically generated on {{ creation_date }}.

      03_mission.yaml: |
        mission: "{{ mission_description }}"
        constraints:
          {{ #each constraints }}
          - "{{ this }}"
          {{ /each }}
        notes: "{{ notes }}"
        {{ #if success_criteria }}
        success_criteria:
          type: "{{ success_criteria.type }}"
          {{ #if success_criteria.tool }}
          tool: "{{ success_criteria.tool }}"
          {{ /if }}
          {{ #if success_criteria.path }}
          path: "{{ success_criteria.path }}"
          {{ /if }}
        {{ /if }}

      04_tasks/current_plan.md: |
        # Current Plan
        {{ mission_description }}

      06_skills/{{ skill_name }}/SKILL.md: |
        ---
        name: {{ skill_name }}
        description: "{{ skill_description }}"
        version: "1.0.0"
        tools:
          {{ #each tools }}
          - name: "{{ this.name }}"
            description: "{{ this.description }}"
            executor: "{{ this.executor }}"
            {{ #if this.mcp_server }}
            mcp_server:
              name: "{{ this.mcp_server }}"
            {{ /if }}
            {{ #if this.native }}
            native:
              action: "{{ this.native }}"
            {{ /if }}
            {{ #if this.function }}
            function:
              parameters: {{ this.function.parameters }}
            {{ /if }}
            defaults: {{ this.defaults }}
          {{ /each }}
        llm:
          mode: "{{ llm_mode }}"
        ---
        # Skill: {{ skill_name }}
        {{ skill_body }}

      09_validation_spec.md: |
        # AOF-S v1.6 Validation Rules
        - Level: {{ level }}
        - Validate against specification `aof-s.yaml` (section `levels[{{ level }}]`).

      10_observations/feedback.yaml: |
        # Agent {{ agent_name }} Feedback
        # Initialized on {{ creation_date }}
        feedback: []

  level_2:
    extends: "level_1"
    context_defaults:
      variables: []
      constitution_body: "# Constitution\n\nDefault constitution for this agent."
      max_previous_lines: 5
      max_rules_in_prompt: 5
      hypothesis_prompt_template: |
        You are a systems analyst. Your mission is: {mission}
        Based on the following data, formulate a hypothesis about the cause of the observed errors.
        Respond in the following format:
        HYPOTHESIS: [your hypothesis]
        CONFIDENCE: [number between 0.0 and 1.0]
        EVIDENCE: [data supporting your hypothesis]
        PREDICTION: [what you expect to see in the next cycle if your hypothesis is correct]

        Current cycle data:
        {current_data}

        Previous cycle data:
        {previous_data}

        Previous hypothesis:
        {previous_hypothesis}

        Actual outcome of previous hypothesis (feedback):
        {feedback}

        Learned rules:
        {rules}
      trust_score_config:
        hypothesis_weight: 0.40
        reliability_weight: 0.30
        sla_weight: 0.15
        peer_weight: 0.15
        history_size: 100
        min_samples: 5

    additional_artifacts:
      05_hypotheses/active.md: |
        # Active Hypothesis
        # Initialized on {{ creation_date }}

      07_world_model/variables.yaml: |
        variables:
          {{ #each variables }}
          - name: "{{ this.name }}"
            type: "{{ this.type }}"
            initial_value: {{ this.initial_value }}
          {{ /each }}

      07_world_model/state.md: |
        # System State
        # Initialized on {{ creation_date }}
        # The runtime will update this file during operation.

      04_tasks/executed/.gitkeep: |
        # Executed delegated tasks archive

      10_observations/anomalies.md: |
        # Detected Anomalies
        # Initialized on {{ creation_date }}
        # The runtime will update this file during operation.

      11_values/constitution.md: |
        # Constitution
        {{ constitution_body }}

      11_values/preferences.yaml: |
        # User preferences for {{ agent_name }}
        # Initialized on {{ creation_date }}
        preferences: {}

      11_values/ledger.yaml: |
        # Audit Ledger for {{ agent_name }}
        # Initialized on {{ creation_date }}
        # The runtime will append entries and verify integrity.
        entries: []

      11_values/trust_score.yaml: |
        # Dynamic Trust Score for {{ agent_name }}
        # Initialized on {{ creation_date }}
        overall: null
        hypothesis_precision: null
        response_reliability: null
        sla_compliance: null
        peer_feedback: null
        history: []

  level_3:
    extends: "level_2"
    context_defaults:
      agents: []
      trust_domain: "noos.local"
      a2a_endpoint: "/a2a/execute"
      a2a_timeout: 30
      a2a_retries: 3
      a2a_events_endpoint: "/a2a/events"
      federation_role: "peer"
      federated_n3s: []
      max_previous_lines: 20
      max_rules_in_prompt: 20
      use_json_response: true
      heartbeat_interval_secs: 30
      heartbeat_timeout_secs: 60
      hypothesis_prompt_template: |
        You are an experienced systems analyst. Your mission is: {mission}
        Based on the following data, formulate a hypothesis about the root cause of the observed errors.

        Current cycle data:
        {current_data}

        Previous cycle data:
        {previous_data}

        Previous hypothesis:
        {previous_hypothesis}

        Actual outcome of previous hypothesis (feedback):
        {feedback}

        Learned rules:
        {rules}

        IMPORTANT: Respond ONLY with a valid JSON object that conforms to this schema:
        {output_schema}
        Do not include any additional text outside the JSON.
      hypothesis_output_schema:
        type: object
        properties:
          hypothesis:
            type: string
          confidence:
            type: number
            minimum: 0.0
            maximum: 1.0
          evidence:
            type: string
          prediction:
            type: string
        required:
          - hypothesis
          - confidence
          - evidence
          - prediction

    additional_artifacts:
      05_hypotheses/active/.gitkeep: |
        # Active hypotheses directory

      05_hypotheses/validated/.gitkeep: |
        # Validated hypotheses archive

      05_hypotheses/falsified/.gitkeep: |
        # Falsified hypotheses archive

      04_tasks/delegated/current_steps.md: |
        # Current Delegated Task
        # Initialized on {{ creation_date }}

      07_world_model/causal_graph.proto: |
        // Placeholder for probabilistic causal graph
        // AOF-S v1.6

      07_world_model/delays.yaml: |
        # Delays between world model variables
        # Initialized on {{ creation_date }}
        delays: []

      07_world_model/expert_corpus/vector_store/.gitkeep: |
        # Vector store placeholder

      07_world_model/expert_corpus/source_documents/.gitkeep: |
        # Source documents placeholder

      07_world_model/expert_corpus/sectors/.gitkeep: |
        # Sector-specific corpus placeholder

      08_memory/semantic/learned_rules.yaml: |
        # Learned semantic rules for {{ agent_name }}
        rules: []

      08_memory/semantic/domain_facts.md: |
        # Domain Facts
        # Initialized on {{ creation_date }}

      08_memory/meta/meta_strategies.yaml: |
        # Meta-cognitive strategy performance history
        strategies: []

      11_values/registry.yaml: |
        agents:
          {{ #each agents }}
          - name: "{{ this.name }}"
            level: {{ this.level }}
            status: "active"
            identity: "{{ this.identity }}"
            trust_score: 1.0
            vcv:
              {{ #each this.vcv }}
              - "{{ this }}"
              {{ /each }}
            capabilities:
              {{ #each this.capabilities }}
              - name: "{{ this.name }}"
                endpoint: "{{ this.endpoint }}"
              {{ /each }}
            heartbeat_interval: {{ this.heartbeat_interval }}
            last_heartbeat: "{{ creation_date }}"
            agent_card_path: "{{ this.agent_card_path }}"
          {{ /each }}

      12_ASA.yaml: |
        identity:
          spiffe_id: "{{ spiffe_id }}"
          trust_domain: "{{ trust_domain }}"
        communication:
          protocol: "A2A"
          channels:
            - type: "request_response"
              endpoint: "{{ a2a_endpoint }}"
              timeout_sec: {{ a2a_timeout }}
              retries: {{ a2a_retries }}
            - type: "event_stream"
              endpoint: "{{ a2a_events_endpoint }}"
              subscription: true
        federation:
          role: "{{ federation_role }}"
          federated_n3s:
            {{ #each federated_n3s }}
            - "{{ this }}"
            {{ /each }}