apiVersion: aof-s/v1
kind: Standard
metadata:
  name: AI Orchestration Files for Systemic Agents
  version: "1.4"
  compatible_versions: ["1.2", "1.3"]
  description: >
    Open standard for versionable AI orchestration files that materialize 
    the cognitive artifacts of the ASA (Adaptive Systemic Agent) architecture.
    Defines how agents are packaged, governed, and orchestrated in a 
    Local-First ecosystem. This specification defines only the file format 
    and conventions; runtimes (such as ASA Agent) interpret the artifacts.
spec:
  implements: "ASA v1.4"
  ecosystem: "Noosystem"

  # ── Principles (8 principles, 0-7) ──
  principles:
    - id: 0
      name: Local-First by Design
      description: >
        Local execution is the default path. AOF‑S artifacts reside on the 
        local file system. The cloud is an optional, explicitly configured 
        fallback.
    - id: 1
      name: Cognitive Separation
      description: >
        Each artifact answers a precise cognitive question: identity, mission, 
        context, world model, memory, observations, or values.
    - id: 2
      name: Progressive Context Loading
      description: >
        The agent loads only the artifacts relevant to the current phase of 
        the ASA cycle, keeping token usage between 2k and 12k tokens.
    - id: 3
      name: Reflexive Causal Intervention
      description: >
        Every action requires a registered hypothesis with predicted effects 
        of 1st, 2nd, and 3rd order. Results are compared and the world model 
        updated.
    - id: 4
      name: Purposeful Cognitive Memory
      description: >
        Memory organized into episodic, semantic, procedural, and (N3) 
        meta-cognitive types, with mathematical mechanisms for forgetting, 
        strengthening, and consolidation.
    - id: 5
      name: Zero Trust Security by Construction
      description: >
        SPIFFE identities, mTLS, and OPA policies integrated from the design 
        phase. Security is progressive by agency level.
    - id: 6
      name: Integrated Evaluability
      description: >
        Every agent declares evaluation metrics and benchmarks. Evaluation is 
        a first-class lifecycle command.
    - id: 7
      name: Progressive Agency
      description: >
        Complexity is activated only when needed. Agents scale from N1 
        (3 files) to N3 (30+ files) through declarative upgrades.

  # ── Ecosystem Paths ──
  ecosystem:
    central_directory:
      description: >
        Central directory for the Noosystem ecosystem, shared by all agents 
        on the same machine. Contains specifications, secrets, reusable 
        packages, and community skill repositories.
      default_path: "~/.noosystem"
      env_variable: "NOOSYSTEM_PATH"
      structure:
        specs: "YAML specification files (aof-s.yaml, asa.yaml, noosystem.yaml)"
        secrets: "Encrypted secrets (Age/SOPS)"
        packages: "Reusable AOF Packages (skills, knowledge)"
        repos: "Community skill repositories"

  # ── Levels ──
  levels:
    - level: 1
      name: Reactive
      directory: ".aof/"
      requires:
        - "00_manifest.yaml"
        - "02_agent_spec.yaml"
      artifacts:
        - "00_manifest.yaml"
        - "01_context_static.md"
        - "02_agent_spec.yaml"
        - "03_mission.yaml"
        - "04_tasks/current_plan.md"
        - "05_skills/"
        - "08_validation_spec.md"
        - "09_observations.log"
      modes:
        ultra_light:
          artifacts: ["00_manifest.yaml", "01_context_static.md", "02_agent_spec.yaml"]
          description: "Minimal configuration for edge devices (ESP32, RPi). No LLM required."

    - level: 2
      name: Systemic
      directory: ".aof/"
      requires:
        - "00_manifest.yaml"
        - "02_agent_spec.yaml"
        - "07_memory/"
      artifacts:
        - "00_manifest.yaml"
        - "01_context_static.md"
        - "02_agent_spec.yaml"
        - "03_mission.yaml"
        - "04_tasks/hypothesis.md"
        - "04_tasks/steps.md"
        - "05_skills/"
        - "06_world_model/variables.yaml"
        - "06_world_model/state.md"
        - "07_memory/episodic/"
        - "07_memory/procedural/policies.yaml"
        - "08_validation_spec.md"
        - "09_observations/feedback.yaml"
        - "09_observations/anomalies.md"
        - "10_values/constitution.md"
        - "10_values/preferences.yaml"

    - level: 3
      name: Orchestrated
      directory: ".aof/"
      requires:
        - "00_manifest.yaml"
        - "02_agent_spec.yaml"
        - "07_memory/"
        - "06_knowledge/registry.yaml"
      artifacts:
        - "00_manifest.yaml"
        - "01_context_static.md"
        - "02_agent_spec.yaml"
        - "03_mission.yaml"
        - "04_hypotheses/active/"
        - "04_hypotheses/validated/"
        - "04_hypotheses/falsified/"
        - "05_skills/"
        - "06_knowledge/world_model/variables.yaml"
        - "06_knowledge/world_model/causal_graph.proto"
        - "06_knowledge/world_model/delays.yaml"
        - "06_knowledge/world_model/state.md"
        - "06_knowledge/expert_corpus/vector_store/"
        - "06_knowledge/expert_corpus/source_documents/"
        - "06_knowledge/expert_corpus/sectors/"
        - "06_knowledge/registry.yaml"
        - "06_knowledge/tasks/current_steps.md"
        - "07_memory/episodic/"
        - "07_memory/semantic/learned_rules.yaml"
        - "07_memory/semantic/domain_facts.md"
        - "07_memory/procedural/policies.yaml"
        - "08_validation_spec.md"
        - "09_observations/feedback_log.yaml"
        - "09_observations/anomaly_notes.md"
        - "10_values/constitution.md"
        - "10_values/user_preferences.yaml"
        - "11_ASA.yaml"
      modes:
        complete:
          phases: 7
          description: "Full cycle with simulation, verification, and orchestration."
        degraded:
          phases: 5
          description: "Edge operation without causal simulation or symbolic verification."
        delegating:
          phases: 4
          description: "Routes tasks to N2/N1 specialists without local execution."

  # ── Progressive Context Loading ──
  context_loading:
    phases:
      - phase: startup
        artifacts: [manifest, context_static, agent_spec, mission, state, constitution]
        tokens_approx: "2-5k"
      - phase: reason
        artifacts: [episodic (top-N), policies, variables]
        tokens_approx: "+2-3k"
      - phase: hypothesize
        artifacts: [causal_graph, delays, expert_corpus (RAG), simulation_skill]
        tokens_approx: "+3-5k"
      - phase: verify
        artifacts: [verification_rules, semantic_contracts, security_policies]
        tokens_approx: "+1-2k (N3 only)"
      - phase: execute
        artifacts: [current_steps, specific_skills]
        tokens_approx: "variable"
      - phase: evaluate
        artifacts: [feedback_log, anomaly_notes]
        tokens_approx: "+1k"
      - phase: reflect
        artifacts: [hypothesis, semantic_rules, policies, meta_cognitive (N3)]
        tokens_approx: "+2-3k"

  # ── Evidence Gate ──
  evidence_gate:
    description: >
      If total_errors == 0 after evaluation, the agent skips hypothesis and 
      reflection phases, reducing token consumption in normal operation.
    implemented_in: "ASA Agent runtime (N2/N3)"
    scope: [N2, N3]

  # ── Manifest (Noosfile) ──
  manifest:
    name: "Noosfile"
    file: "noosfile.yaml"
    api_version: "noos.cncf.io/v1alpha2"
    sections:
      - agents
      - security
      - shared_services
      - global_policies
      - evaluation
      - inference
    agent_fields:
      active_skills:
        description: "Optional list of skill names active for this agent."
        type: "list of strings"
        default: "all skills in 05_skills/"
      metadata:
        description: "Optional free-form key-value pairs for project/instance identification."
        type: "map"
      profile:
        description: "Deployment profile this agent instance runs on."
        type: "string"
        enum: ["standalone", "edge", "enterprise"]
      imports:
        description: "Optional list of AOF Packages to incorporate into this agent."
        type: "list"
        items:
          path: "Path to the package directory"
          include: "List of ranges to import (e.g., ['05_skills', '06_world_model'])"
          conflict_policy: "merge | override | skip (default: merge)"

  # ── Deployment Profiles ──
  deployment_profiles:
    standalone:
      description: "Single agent on a local device. No network dependencies."
      required_components: [".aof/", "binario N1/N2"]
      latency_target: "<100ms"
      privacy: "maximum"
      scalability: "1 agent"
      offline_resilience: "total"
    edge:
      description: "Multiple agents on local network with lightweight messaging."
      required_components: [".aof/", "NATS", "LanceDB/SQLite (optional)"]
      latency_target: "<100ms"
      privacy: "high"
      scalability: "10-50 agents"
      offline_resilience: "high"
    enterprise:
      description: "Full ecosystem with Kubernetes, service mesh, and Zero Trust security."
      required_components: [".aof/", "Kubernetes", "Istio", "SPIRE", "OPA", "Kafka"]
      latency_target: "<500ms"
      privacy: "medium (depends on architecture)"
      scalability: "100s of agents"
      offline_resilience: "low (cloud-dependent)"

  # ── Secrets Management ──
  secrets:
    description: >
      Secrets (API keys, tokens, credentials) must never be stored in plain 
      text within .aof/ artifacts. Use references of the form ${env:VAR} or 
      ${secret:path}. Resolution is delegated to the runtime according to the 
      deployment profile. Secrets are stored in the central directory 
      (~/.noosystem/secrets/ or $NOOSYSTEM_PATH/secrets/).
    syntax:
      env: "${env:VARIABLE_NAME}"
      secret: "${secret:path/to/secret}"
    resolution:
      standalone: "Environment variables or .env file"
      edge: "Encrypted file (Age/SOPS) with local master key, stored in ~/.noosystem/secrets/"
      enterprise: "External secret manager (Vault, AWS Secrets Manager, etc.) or SPIFFE/SPIRE"
    audit:
      description: "Every secret resolution is logged (timestamp, secret name, backend, outcome) without recording the value."

  # ── CLI ──
  cli:
    name: "noctl"
    commands:
      - init
      - apply
      - upgrade
      - status
      - get
      - describe
      - evaluate
      - security
      - diagnose
      - "memory compact"
      - "inference route"
      - validate

  # ── Protocol Integration ──
  protocols:
    transport: "SLIM (AGNTCY)"
    syntactic:
      a2a:
        description: "Agent-to-Agent communication for discovery and task delegation."
        usage: "Agent Cards derived from 02_agent_spec.yaml"
        configuration: "11_ASA.yaml (communication section)"
      mcp:
        description: "Model Context Protocol for tool integration."
        usage: "Skills declare MCP servers; tools can be local or MCP-based"
    semantic:
      description: >
        Semantic alignment uses A2A Agent Cards with Versioned Capability 
        Vectors (VCVs) and optional ontology bindings. No separate semantic 
        protocol is required; NSL conventions travel as metadata over A2A/MCP.
      vcv:
        description: "Versioned Capability Vectors enable semantic agent discovery."
        format: "capability:v1, capability:v2"
        stored_in: "registry.yaml"

  # ── Registry ──
  registry:
    description: "Agent registry maintained by the N3 orchestrator."
    file: "06_knowledge/registry.yaml"
    fields:
      - name
      - level
      - status
      - identity (SPIFFE)
      - trust_score
      - vcv (Versioned Capability Vectors)
      - capabilities (A2A endpoints)
      - heartbeat_interval
      - endpoint

  # ── Skills ──
  skills:
    format: "agentskills.io compatible (subdirectory per skill)"
    description: >
      Each skill is a subdirectory inside 05_skills/ containing a SKILL.md 
      file with YAML frontmatter and Markdown instructions. Optional 
      subdirectories: scripts/, references/, assets/.
    structure:
      SKILL.md: "YAML frontmatter + Markdown body (mandatory)"
      scripts/: "executable code (optional)"
      references/: "reference docs (optional)"
      assets/: "templates and resources (optional)"
    llm_modes:
      never: "Deterministic execution; no LLM call."
      always: "LLM consulted before every execution."
      on_error: "LLM consulted only if previous cycle had errors."
      on_change: "LLM consulted when mission, context, or endpoints change."
      cached: >
        Agent first searches semantic memory for a matching rule with 
        sufficient confidence. If found, applies it without LLM. If not, 
        consults LLM and stores the new response as a semantic rule.
    tool_types:
      mcp_server:
        description: "Tool provided by a Model Context Protocol server."
        fields:
          name: "MCP server name"
          command: "Optional launch command"
          args: "Optional arguments"
      native:
        description: "Tool built into the runtime."
        fields:
          action: "Native action identifier"
        known_actions:
          - deploy_agent
          - generate_workspace
          - validate_aof
      function:
        description: "Tool defined using JSON Schema, compatible with OpenAI/Anthropic tool calling."
        fields:
          parameters: "JSON Schema for the tool's input"
    example:
      name: "health_check"
      version: "1.0.0"
      tools:
        - name: "http_health"
          description: "Check HTTP endpoint health"
          mcp_server:
            name: "monitoring-tools"
          function:
            parameters:
              type: object
              properties:
                url:
                  type: string
              required: ["url"]
          defaults:
            method: "GET"
            timeout_ms: 5000
          auth:
            api_key: ${env:MONITORING_API_KEY}
      llm:
        mode: "on_error"

  # ── Agent Spec ──
  agent_spec:
    description: "Additional fields allowed in 02_agent_spec.yaml beyond role and VCVs."
    optional_fields:
      allowed_tools:
        description: "List of tool names this agent is permitted to use."
      constraints:
        description: "Operational limits (max_parallel_actions, timeout_per_request_ms, etc.)."
      security_overrides:
        description: "Per-agent OPA policy overrides (if different from global Noosfile policies)."
      communication:
        description: "Agent-level A2A communication settings (channels, timeouts, retries)."

  # ── 11_ASA.yaml ──
  identity_communication:
    description: "N3-only artifact declaring noosystemic identity and communication settings."
    file: "11_ASA.yaml"
    sections:
      identity:
        spiffe_id: "SPIFFE identity"
        trust_domain: "Trust domain"
      communication:
        protocol: "A2A"
        channels:
          - type: "request_response"
            endpoint: "/a2a/execute"
            timeout_sec: 30
            retries: 3
          - type: "event_stream"
            endpoint: "/a2a/events"
            subscription: true

  # ── Security ──
  security:
    identity: "SPIFFE"
    transport: "mTLS"
    policies: "OPA (declared in Noosfile or per-agent in 02_agent_spec.yaml)"
    defense: "Bayesian Trust Defense against memory poisoning"
    compliance:
      - "OWASP Top 10 for Agentic Applications (2026)"
      - "NIST AI RMF 1.0"
    progressive:
      level_1: "OS sandbox (gVisor). No SPIFFE/OPA required."
      level_2: "Auto-configured mTLS. OPA optional with default policies."
      level_3: "SPIFFE, mTLS, and OPA mandatory."

  # ── Inference (Local-First) ──
  inference:
    mode: "local_first"
    engines:
      - ollama
      - llama.cpp
      - vLLM
    fallback: "cloud (optional, configurable via triggers)"
    configuration: "02_agent_spec.yaml (inference section)"

  # ── Evaluation ──
  evaluation:
    metrics:
      - hypothesis_precision
      - falsification_rate
      - p95_latency_ms
      - avg_tokens_per_intervention
      - task_success_rate
    benchmark_suites:
      - "MCP-AgentBench"
    commands:
      - "noctl evaluate agent <name>"
      - "noctl evaluate ecosystem"

  # ── Templates ──
  templates:
    description: >
      Content templates for each artifact. The N3 uses these to generate 
      agent configurations from structured plans (JSON output of the LLM).
      Placeholders use {{ double braces }} syntax.
    level_1:
      00_manifest.yaml: |
        framework: AOF‑S v1.4
        level: 1
        name: "{{ agent_name }}"
        project: "{{ project_name }}"
        created: "{{ creation_date }}"
        agent_instance: "{{ instance_id }}"
        profile: "{{ profile }}"
        active_skills:
          {{ #each active_skills }}
          - "{{ this }}"
          {{ /each }}
        imports:
          {{ #each imports }}
          - path: "{{ this.path }}"
            include:
              {{ #each this.include }}
              - "{{ this }}"
              {{ /each }}
            conflict_policy: "{{ this.conflict_policy }}"
          {{ /each }}
      02_agent_spec.yaml: |
        role: "{{ role }}"
        model: "{{ model }}"
        vcv:
          {{ #each vcv }}
          - "{{ this }}"
          {{ /each }}
        allowed_tools:
          {{ #each allowed_tools }}
          - "{{ this }}"
          {{ /each }}
        constraints:
          max_parallel_actions: {{ max_parallel_actions }}
          timeout_per_request_ms: {{ timeout_per_request_ms }}
        inference:
          mode: "local_first"
          engines:
            - name: "ollama"
              models: ["{{ model }}"]
        evaluation:
          metrics:
            - task_success_rate
      03_mission.yaml: |
        mission:
          description: "{{ mission_description }}"
          success_criteria:
            {{ #each success_criteria }}
            - "{{ this }}"
            {{ /each }}
      05_skills/{{ skill_name }}/SKILL.md: |
        ---
        name: {{ skill_name }}
        description: "{{ skill_description }}"
        version: "1.0.0"
        tools:
          {{ #each tools }}
          - name: "{{ this.name }}"
            {{ #if this.mcp_server }}
            mcp_server:
              name: "{{ this.mcp_server }}"
            {{ /if }}
            {{ #if this.native }}
            native:
              action: "{{ this.native }}"
            {{ /if }}
            function:
              parameters: {{ this.parameters_json }}
            defaults: {{ this.defaults_json }}
          {{ /each }}
        llm:
          mode: "{{ llm_mode }}"
        ---
        # Skill: {{ skill_name }}
        {{ skill_body }}
    level_2:
      extends: "level_1"
      additional_artifacts:
        06_world_model/variables.yaml: |
          variables:
            {{ #each variables }}
            - name: "{{ this.name }}"
              type: "{{ this.type }}"
              initial_value: {{ this.initial_value }}
            {{ /each }}
        10_values/constitution.md: |
          # Constitution
          {{ constitution_body }}
    level_3:
      extends: "level_2"
      additional_artifacts:
        06_knowledge/registry.yaml: |
          agents:
            {{ #each agents }}
            - name: "{{ this.name }}"
              level: {{ this.level }}
              status: "active"
              identity: "{{ this.identity }}"
              trust_score: 1.0
              vcv:
                {{ #each this.vcv }}
                - "{{ this }}"
                {{ /each }}
              capabilities:
                {{ #each this.capabilities }}
                - name: "{{ this.name }}"
                  endpoint: "{{ this.endpoint }}"
                {{ /each }}
              heartbeat_interval: {{ this.heartbeat_interval }}
            {{ /each }}
        11_ASA.yaml: |
          identity:
            spiffe_id: "{{ spiffe_id }}"
            trust_domain: "{{ trust_domain }}"
          communication:
            protocol: "A2A"
            channels:
              - type: "request_response"
                endpoint: "{{ a2a_endpoint }}"
                timeout_sec: {{ a2a_timeout }}
                retries: {{ a2a_retries }}
              - type: "event_stream"
                endpoint: "{{ a2a_events_endpoint }}"
                subscription: true

  # ── Artifacts Format ──
  artifacts_format:
    description: >
      Each artifact has a specific format according to its cognitive purpose.
      The runtime must parse artifacts based on this classification, without
      using automatic detection heuristics.
    classification:
      yaml_pure:
        description: "Structured data that the runtime parses directly."
        applies_to:
          - "00_manifest.yaml"
          - "02_agent_spec.yaml"
          - "03_mission.yaml"
          - "06_knowledge/world_model/variables.yaml"
          - "06_knowledge/registry.yaml"
          - "07_memory/semantic/learned_rules.yaml"
          - "07_memory/procedural/policies.yaml"
          - "07_memory/meta/meta_strategies.yaml"
          - "09_observations/feedback.yaml"
          - "09_observations/feedback_log.yaml"
          - "10_values/preferences.yaml"
      markdown_pure:
        description: "Free text for humans or for the agent as narrative."
        applies_to:
          - "01_context_static.md"
          - "04_tasks/current_plan.md"
          - "04_tasks/hypothesis.md"
          - "04_tasks/steps.md"
          - "04_hypotheses/active/*.md"
          - "04_hypotheses/validated/*.md"
          - "04_hypotheses/falsified/*.md"
          - "06_knowledge/world_model/state.md"
          - "06_knowledge/tasks/current_steps.md"
          - "07_memory/semantic/domain_facts.md"
          - "08_validation_spec.md"
          - "09_observations/anomalies.md"
          - "09_observations/anomaly_notes.md"
          - "10_values/constitution.md"
      markdown_with_frontmatter:
        description: >
          Structured data (YAML frontmatter) plus human-readable instructions
          (Markdown body). This is the ONLY format that uses frontmatter.
        applies_to:
          - "05_skills/*/SKILL.md"
    notes:
      - "The runtime must NOT attempt to auto-detect the format."
      - "current_steps.md is plain Markdown. The N3 delegates an objective, not specific tools."
      - "hypothesis.md is plain Markdown. The LLM generates semi-structured text parsed with simple patterns."
      - "preferences.yaml is YAML but may contain flexible key-value pairs."
  # ── Sectors ──
  sectors:
    supported:
      - hospital
      - datacenter
      - port
      - manufacturing
      - campus
      - airport
    description: >
      The Noosystem adapts to different sectors by changing only the agent 
      library and the expert_corpus. Base architecture remains unchanged.
